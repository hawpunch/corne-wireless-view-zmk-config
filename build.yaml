# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adaptor
    snippet: studio-rpc-usb-uart
    artifact-name: corne_dongle_prospector
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right_peripheral
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right_peripheral
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: reset_xiao_dongle
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: reset_nice_nano
